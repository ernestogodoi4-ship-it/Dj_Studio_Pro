<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>DJ Studio PRO — Inicializando</title>
  <style>
    :root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif;background:#090b0f;color:#f5f5f7}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#090b0f}
    body{position:relative;user-select:none;-webkit-app-region:drag}
    .splash-art{position:absolute;inset:0;background:#090b0f url("./assets/splash/splash-background.png") center center/cover no-repeat}
    .loading-panel{position:absolute;left:19.8%;top:77.2%;width:60.5%;height:12.7%;min-height:64px;padding:2.05% 2.9%;border:1px solid rgba(103,112,122,.44);border-radius:16px;background:linear-gradient(145deg,rgba(7,9,12,.97),rgba(5,6,8,.96));box-shadow:0 8px 30px rgba(0,0,0,.4);display:flex;flex-direction:column;justify-content:center;gap:10px}
    .status{margin:0;color:#f5f5f7;font-size:clamp(13px,1.35vw,20px);font-weight:600;line-height:1.2;text-shadow:0 1px 5px #000}
    .progress-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px}
    .progress-track{height:clamp(12px,1.45vw,24px);overflow:hidden;border:1px solid #30363d;border-radius:999px;background:#111419;box-shadow:inset 0 1px 4px #0009}
    .progress-fill{width:4%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#ff8a00 0%,#ff5726 52%,#ff1764 100%);box-shadow:0 0 14px rgba(255,69,69,.35);transition:width .42s cubic-bezier(.2,.75,.25,1)}
    .progress-value{min-width:3ch;color:#f5f5f7;font-size:clamp(13px,1.35vw,20px);font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
    @media(max-width:700px){.loading-panel{left:7%;top:auto;bottom:7%;width:86%;height:auto;min-height:72px;padding:12px 16px;border-radius:12px;gap:8px}.status{font-size:14px}.progress-track{height:13px}.progress-value{font-size:14px}}
    @media(prefers-reduced-motion:reduce){.progress-fill{transition:none}}
  </style>
</head>
<body>
  <div class="splash-art" aria-hidden="true"></div>
  <main class="loading-panel" role="status" aria-live="polite" aria-label="Inicialização do DJ Studio PRO">
    <p class="status" id="startupStatus">Inicializando o DJ Studio PRO…</p>
    <div class="progress-row">
      <div class="progress-track" role="progressbar" aria-label="Progresso da inicialização" aria-valuemin="0" aria-valuemax="100" aria-valuenow="4"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-value" id="progressValue">4%</span>
    </div>
  </main>
  <script>
    (() => {
      const status = document.getElementById('startupStatus');
      const fill = document.getElementById('progressFill');
      const value = document.getElementById('progressValue');
      const bar = document.querySelector('[role="progressbar"]');
      window.djStudioSplash?.onProgress(({ progress, status: message }) => {
        const percent = Math.max(0, Math.min(100, Math.round(Number(progress) || 0)));
        fill.style.width = percent + '%';
        value.textContent = percent + '%';
        bar.setAttribute('aria-valuenow', String(percent));
        if (message) status.textContent = message;
      });
    })();
  </script>
</body>
</html>
